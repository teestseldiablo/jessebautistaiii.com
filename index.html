<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jesse Bautista III | Private Digital Twin</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include Three.js for 3D Digital Twin Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <!-- Private Authentication Gate Overlay -->
    <div id="auth-gate" class="auth-overlay">
        <div class="auth-box">
            <h2>Restricted Access</h2>
            <p>Cryptographic verification required for Digital Twin initialization.</p>
            <input type="password" id="passkey-input" placeholder="Enter Secure Passkey..." />
            <button onclick="verifyAccess()">Authenticate</button>
        </div>
    </div>

    <!-- Main Private Digital Twin Dashboard (Hidden by default) -->
    <div id="dashboard-container" style="display: none;">
        <div id="canvas-container"></div>
        <div class="hud-overlay">
            <h1>Jesse Bautista III // Digital Twin</h1>
            <div class="hud-grid">
                <div class="hud-card">
                    <h3>BAUTISTA INC.</h3>
                    <p>Status: Active</p>
                </div>
                <div class="hud-card">
                    <h3>Handyman Painting L.L.C</h3>
                    <p>Status: Active (320-321-9359)</p>
                </div>
                <div class="hud-card">
                    <h3>$ee Money Productions</h3>
                    <p>Alias: Teests El Diablo / Lil Devil</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function verifyAccess() {
            const input = document.getElementById('passkey-input').value;
            // Local client-side security gate placeholder (will be replaced with Vercel Edge Auth / JWT)
            if (input === "JB3-SECURE-2026") {
                document.getElementById('auth-gate').style.display = 'none';
                document.getElementById('dashboard-container').style.display = 'block';
                init3DEnvironment();
            } else {
                alert('Access Denied. Invalid Credentials.');
            }
        }

        function init3DEnvironment() {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Placeholder Digital Twin Core Node (Wireframe Hologram Avatar Node)
            const geometry = new THREE.IcosahedronGeometry(2, 2);
            const material = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true });
            const avatarCore = new THREE.Mesh(geometry, material);
            scene.add(avatarCore);

            camera.position.z = 5;

            function animate() {
                requestAnimationFrame(animate);
                avatarCore.rotation.x += 0.005;
                avatarCore.rotation.y += 0.01;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
